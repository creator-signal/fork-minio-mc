name: Creator Signal CI

on:
  pull_request:
    branches:
      - creator-signal/master
  push:
    branches:
      - creator-signal/master

permissions:
  contents: read

jobs:
  source-and-image:
    name: Source build, unit tests and image smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.9
      - name: Run short unit tests
        env:
          CGO_ENABLED: "0"
        run: go test -short ./...
      - name: Derive image build metadata from this checkout
        id: metadata
        run: |
          echo "version=$(git show -s --format=%cI HEAD | sed 's/+00:00/Z/')" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "year=$(git show -s --format=%cd --date=format:%Y HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build the release image from this checkout
        run: |
          docker buildx build --load --platform linux/amd64 \
            --file Dockerfile.creator-signal \
            --build-arg VERSION="${{ steps.metadata.outputs.version }}" \
            --build-arg RELEASE_TAG="cs-ci-${{ github.sha }}" \
            --build-arg COMMIT_ID="$GITHUB_SHA" \
            --build-arg SHORT_COMMIT_ID="${{ steps.metadata.outputs.short_sha }}" \
            --build-arg COPYRIGHT_YEAR="${{ steps.metadata.outputs.year }}" \
            --tag creator-signal-mc-ci:${GITHUB_SHA} .
      - name: Smoke-test the built image
        run: docker run --rm creator-signal-mc-ci:${GITHUB_SHA} --version
